name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Force bundled Node 20 actions onto Node 24 ahead of GitHub's 2026-06-16 cutover
# (consistent with the other spore-host repos).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    # Self-hosted runner on orion.local (Apple M4 Pro, arm64). To fall back to
    # GitHub-hosted, change this line to: runs-on: ubuntu-latest
    runs-on: [self-hosted, orion]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # JDK 21: the io.nextflow.nextflow-plugin toolchain builds with a JDK 21
      # toolchain (sources still target Java 17). Provide 21 so Gradle uses it
      # rather than downloading one.
      - name: Setup JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Build
        run: ./gradlew assemble --no-daemon

      # Run the Spock suite so CI actually gates on the unit tests (#59) — the
      # generated-shell-correctness and command-builder tests are the project's
      # main safety net and were previously never executed in CI.
      - name: Test
        run: ./gradlew test --no-daemon
