name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Force bundled Node 20 actions onto Node 24 ahead of GitHub's 2026-06-16 cutover
# (consistent with the other spore-host repos).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    # Self-hosted runner on orion.local (Apple M4 Pro, arm64). To fall back to
    # GitHub-hosted, change this line to: runs-on: ubuntu-latest
    runs-on: [self-hosted, orion]
    steps:
      - uses: actions/checkout@v6

      # JDK 17: the deps pull Groovy 3 (io.nextflow:nextflow:23.10.0), which
      # cannot parse JDK 21+ bytecode ("Unsupported class file major version").
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon
