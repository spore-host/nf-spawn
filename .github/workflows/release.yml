name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the GitHub Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21 — see ci.yml (the nextflow-plugin toolchain builds on JDK 21).
      - name: Setup JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Sanity-check the tag matches build.gradle's version, so the artifact and
      # the release tag never drift.
      - name: Verify version matches tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -E "^version" build.gradle | sed -E "s/.*'(.*)'.*/\1/")
          echo "tag=$tag build.gradle version=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match build.gradle version $ver"
            exit 1
          fi

      - name: Build plugin zip
        run: ./gradlew assemble --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: build/distributions/nf-spawn-*.zip
          generate_release_notes: true
