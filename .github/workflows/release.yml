name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the GitHub Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish plugin
    runs-on: [self-hosted, orion]
    steps:
      - uses: actions/checkout@v6

      # JDK 21 — see ci.yml (the nextflow-plugin toolchain builds on JDK 21).
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Sanity-check the tag matches build.gradle's version, so the artifact and
      # the release tag never drift.
      - name: Verify version matches tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -E "^version" build.gradle | sed -E "s/.*'(.*)'.*/\1/")
          echo "tag=$tag build.gradle version=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match build.gradle version $ver"
            exit 1
          fi

      - name: Build plugin zip
        run: ./gradlew assemble --no-daemon

      # Use the action rather than the gh CLI — the self-hosted runner container
      # has no gh installed.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/nf-spawn-*.zip
          generate_release_notes: true
