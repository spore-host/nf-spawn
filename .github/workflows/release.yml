name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the GitHub Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish jar
    runs-on: [self-hosted, orion]
    steps:
      - uses: actions/checkout@v6

      # JDK 17 — see ci.yml (Groovy 3 can't parse JDK 21+ bytecode).
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Sanity-check the tag matches build.gradle's version, so the jar name and
      # the release tag never drift.
      - name: Verify version matches tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -E "^version" build.gradle | sed -E "s/.*'(.*)'.*/\1/")
          echo "tag=$tag build.gradle version=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match build.gradle version $ver"
            exit 1
          fi

      - name: Build jar
        run: ./gradlew jar --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "build/libs/nf-spawn-${ver}.jar" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
