name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the GitHub Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 21 — see ci.yml (the nextflow-plugin toolchain builds on JDK 21).
      - name: Setup JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Hard-fail the tag if the built zip's manifest doesn't actually report
      # this tag's version (#91). The old check here only compared the tag to
      # build.gradle's SOURCE `version = '...'` line — which is exactly what
      # was correct when v0.10.0 shipped a zip whose MANIFEST.MF still said
      # 0.8.0, because a source-line grep can't see what the build actually
      # produced. This script builds the real zip and reads Plugin-Version out
      # of it. It also fails while CHANGELOG.md still says [Unreleased] for
      # this tag. This is the only build step now — it leaves the artifact in
      # build/distributions for the publish step below.
      - name: Release version guard (verifies the built zip's manifest, not just the source line)
        run: scripts/check-release-version.sh "${GITHUB_REF_NAME}"

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: build/distributions/nf-spawn-*.zip
          generate_release_notes: true
