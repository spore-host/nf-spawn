import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'groovy'
}

group = 'io.nextflow'
version = '0.1.3'

repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
}

configurations {
    // compileOnly is provided by the `groovy`/`java` plugin (non-resolvable by
    // design). Don't redefine it — just let test code see the compileOnly deps.
    testImplementation.extendsFrom compileOnly
}

dependencies {
    compileOnly 'io.nextflow:nextflow:23.10.0'
    compileOnly 'org.pf4j:pf4j:3.9.0'
    compileOnly 'org.slf4j:slf4j-api:2.0.6'
    testImplementation 'org.spockframework:spock-core:2.3-groovy-3.0'
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    main {
        groovy { srcDirs = ['src/main/groovy'] }
        resources { srcDirs = ['src/main/resources'] }
    }
}

// Replace the @version@ token in META-INF/nextflow.plugins with the build
// version so the plugin manifest can't drift from build.gradle (#7).
processResources {
    filesMatching('META-INF/nextflow.plugins') {
        filter(ReplaceTokens, tokens: [version: project.version.toString()])
    }
}

jar {
    manifest {
        attributes 'Plugin-Id': 'nf-spawn',
                   'Plugin-Version': version,
                   'Plugin-Class': 'io.nextflow.spawn.SpawnPlugin',
                   'Plugin-Provider': 'scttfrdmn'
    }
    from sourceSets.main.output
}
